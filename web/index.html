  <style>
    html, body { margin: 0; padding: 0; background: #080808; }
    /*
      Shown until Flutter paints its first frame. Without it the visitor stares
      at a white page while the engine and app bundle download.
    */
    #boot {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: #080808;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      text-align: center;
      padding: 24px;
      transition: opacity .25s ease;
    }
    #boot[hidden] { display: none; }
    #boot.fading { opacity: 0; }
    #boot h1 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -.6px; }
    #boot p { margin: 0; font-size: 14px; color: #9AA7BA; }
    #boot .bar {
      width: 132px; height: 3px; border-radius: 2px;
      background: rgba(255,255,255,.12); overflow: hidden;
    }
    #boot .bar i {
      display: block; width: 40%; height: 100%; border-radius: 2px;
      background: #BCFF00; animation: slide 1.1s ease-in-out infinite;
    }
    @keyframes slide {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(250%); }
    }
    @media (prefers-reduced-motion: reduce) {
      #boot .bar i { animation: none; width: 100%; }
    }
  </style>
</head>

  <script>
    // Flutter dispatches this on window once it has painted. Fade rather than
    // cut, so the handover does not read as a flash.
    window.addEventListener('flutter-first-frame', function () {
      var boot = document.getElementById('boot');
      if (!boot) return;
      boot.classList.add('fading');
      setTimeout(function () { boot.hidden = true; }, 260);
    });
  </script>
